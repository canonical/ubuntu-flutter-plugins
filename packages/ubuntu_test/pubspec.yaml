name: ubuntu_test
description: Provides test extensions for Ubuntu applications.
homepage: https://github.com/canonical/ubuntu-flutter-plugins
repository: https://github.com/canonical/ubuntu-flutter-plugins/tree/main/packages/ubuntu_test
issue_tracker: https://github.com/canonical/ubuntu-flutter-plugins/issues
version: 0.2.3+4

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_markdown: ^0.7.3+1
  flutter_svg: ^2.0.10+1
  flutter_test:
    sdk: flutter
  # flutter_html 3.0.0 relies on an API removed in html 0.15.7
  html: ">=0.15.5 <0.15.7"
  matcher: ^0.12.16+1
  mockito: ^5.4.4
  ubuntu_localizations: ^0.5.2+6
  yaru_test: ^1.0.0

dev_dependencies:
  material_ui: ^1.0.0
  ubuntu_lints: ^0.4.2

flutter:
  assets:
    - assets/
