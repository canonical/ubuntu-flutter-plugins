weblate:
  api_url: https://hosted.weblate.org/api/
  project: ubuntu-desktop-translations

github:
  repository: canonical/ubuntu-flutter-plugins

ai:
  api_url: https://openrouter.ai/api/v1
  model: google/gemini-3.8-flash

components:
  - weblate_component: ubuntu-flutter-plugins
    source_locale: en
    context_locales: [de, fr, es]
    format: arb
    source_file: packages/ubuntu_localizations/lib/src/l10n/ubuntu_en.arb
    path: packages/ubuntu_localizations/lib/src/l10n/ubuntu_{locale}.arb
    push_after_commit: false