name: Prepare release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Version as prerelease'
        required: false
        default: false
        type: boolean

jobs:
  prepare-release:
    name: Prepare release
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Atsumi3/actions-setup-fvm@0.0.3
      - uses: bluefireteam/melos-action@v3
        with:
          run-versioning: ${{ inputs.prerelease == false }}
          run-versioning-prerelease: ${{ inputs.prerelease == true }}
          publish-dry-run: true
      # melos-action's create-pr cannot sign commits, so create the PR directly.
      - uses: peter-evans/create-pull-request@v8
        with:
          sign-commits: true
          branch: release-prepare
          delete-branch: true
          title: 'chore(release): Publish packages'
          body: Prepared all packages to be released to pub.dev
          commit-message: 'chore(release): publish packages'
